<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roXtra Tischkickerturnier 2026</title>
<style>
  :root{
    --bg:#071528; --card:#0e2746; --line:#1c3f68; --txt:#e8eef7;
    --muted:#8fa6c4; --accent:#1f8bff; --gold:#ffc83d; --green:#2fd18a; --red:#ff5d6c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
  header{background:#0a1c33;border-bottom:3px solid var(--accent)}
  header img{display:block;width:100%;max-width:960px;margin:0 auto}
  .subbar{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;
          padding:12px 16px;background:#0c2342;border-bottom:1px solid var(--line);
          font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .subbar b{color:var(--accent);font-size:15px}
  .subbar span{opacity:.5}
  main{max-width:1150px;margin:0 auto;padding:24px 16px 60px}
  h2{margin:34px 0 12px;font-size:20px;border-left:4px solid var(--accent);padding-left:10px}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;padding:12px 16px;background:#143257;font-size:16px;
           border-left:4px solid var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
  th{background:#102c4e;color:var(--muted);font-weight:600;font-size:12px;
     text-transform:uppercase;letter-spacing:.4px}
  tbody tr:last-child td{border-bottom:none}
  td.team{text-align:left}
  .teamcell{display:flex;align-items:center;gap:10px}
  .team-link{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
  .team-link:hover .tname,.team-link:focus-visible .tname{color:var(--accent);text-decoration:underline}
  .teamcell img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#ffffff14;flex:0 0 auto}
  .tname{font-weight:600}
  .players{font-size:11.5px;color:var(--muted)}
  .pts{font-weight:700;color:var(--accent)}
  .pos{color:var(--muted);width:28px}
  tr.q1 .pos,tr.q2 .pos{color:var(--accent);font-weight:700}
  tr.q1,tr.q2{background:#1f8bff14}
  .sched td{text-align:left}
  .sched td.sc{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .sched tr.open td.sc{color:var(--muted);font-weight:400}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
       background:#1b3f68;color:var(--muted);white-space:nowrap}
  .tag.ko{background:var(--accent);color:#06192e;font-weight:700}
  .win{color:var(--green)} .lose{color:var(--red)}
  .prediction{display:block;margin-top:3px;font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
  .prediction .better{color:var(--green)}
  .prediction .draw{color:var(--gold)}
  .prediction .worse{color:var(--red)}
  .matchday-card{background:linear-gradient(135deg,#143257,#0e2746);border:1px solid var(--accent);
                 border-radius:12px;padding:18px 22px;box-shadow:0 10px 30px #0004}
  .matchday-meta{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.8px;text-transform:uppercase}
  .matchday-game{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.7fr) minmax(0,1fr);
                 align-items:center;gap:20px;margin-top:14px}
  .matchday-team{display:flex;align-items:center;gap:14px;color:var(--txt);font:inherit;font-weight:700;
                 background:none;border:0;padding:0;cursor:pointer;min-width:0}
  .matchday-team:last-child{flex-direction:row-reverse;text-align:right}
  .matchday-team:hover span,.matchday-team:focus-visible span{color:var(--accent);text-decoration:underline}
  .matchday-team img{width:82px;height:82px;object-fit:contain;border-radius:8px;background:#ffffff14;flex:0 0 auto}
  .matchday-team .team-name{display:block;font-size:17px;overflow-wrap:anywhere}
  .matchday-team .players{display:block;margin-top:3px}
  .matchday-team:first-child .players{text-align:left}
  .matchday-score{text-align:center;font-variant-numeric:tabular-nums}
  .matchday-score strong{display:block;font-size:32px;line-height:1.1;color:var(--gold)}
  .matchday-score .prediction{margin-top:8px;white-space:normal}
  .detail-backdrop{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:#020914b8}
  .detail-backdrop[hidden]{display:none}
  .detail-modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 50px #0008}
  .detail-head{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#143257;border-bottom:1px solid var(--line)}
  .detail-head img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#ffffff14;cursor:zoom-in}
  .detail-head h3{margin:0;font-size:20px}
  .detail-head .players{margin-top:3px}
  .detail-close{margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--txt);font-size:20px;cursor:pointer}
  .detail-close:hover,.detail-close:focus-visible{border-color:var(--accent);color:var(--accent)}
  .detail-body{padding:18px 20px}
  .detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
  .detail-stat{padding:9px 5px;text-align:center;background:#102c4e;border-radius:6px}
  .detail-stat b{display:block;font-size:18px;color:var(--accent)}
  .detail-stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
  .detail-body h4{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .detail-games{width:100%;border-collapse:collapse;font-size:13px}
  .detail-games td{padding:8px 4px;text-align:left}
  .detail-games td:last-child{text-align:right;white-space:nowrap}
  .detail-games tr:last-child td{border-bottom:0}
  .rating-note{color:var(--muted);font-size:11px;margin-top:14px}
  .logo-preview{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
                padding:24px;background:#020914dd}
  .logo-preview[hidden]{display:none}
  .logo-preview img{width:min(680px,90vw);height:min(680px,85vh);object-fit:contain;
                    border-radius:12px;background:#ffffff14;cursor:zoom-out}
  @media(max-width:560px){.detail-stats{grid-template-columns:repeat(3,1fr)}.detail-modal{max-height:94vh}.prediction{white-space:normal}}

  /* Turnierbaum: 2 Halbfinals links, Verbinder, Finale rechts */
  .bracket{display:grid;grid-template-columns:minmax(250px,1fr) 56px minmax(270px,1.15fr);
           align-items:center}
  .col{display:flex;flex-direction:column;gap:30px}
  .round-label{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
               color:var(--muted);text-align:center;margin-bottom:12px}
  .link{position:relative;align-self:stretch;min-height:160px}
  .link::before{content:"";position:absolute;left:0;right:50%;top:25%;bottom:25%;
                border:2px solid var(--line);border-left:none;border-radius:0 10px 10px 0}
  .link::after{content:"";position:absolute;left:50%;right:0;top:50%;
               border-top:2px solid var(--line)}
  .p3{max-width:420px;margin:26px auto 0}

  .match{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .match h4{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .match .row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .match .row img{width:30px;height:30px;object-fit:contain;border-radius:6px;background:#ffffff14}
  .match .row .team-link{display:flex;align-items:center;gap:10px}
  .match .row .n{flex:1}
  .match .row .g{font-weight:800;font-size:18px;min-width:26px;text-align:right}
  .mdate{margin-top:8px;text-align:right;font-size:11.5px;color:var(--muted)}

  .match.final{border:2px solid var(--gold);background:linear-gradient(#17315a,#0e2746);
               padding:20px 22px;box-shadow:0 0 0 6px #ffc83d14,0 10px 30px #0006}
  .match.final h4{color:var(--gold);font-size:15px;letter-spacing:2px;font-weight:800}
  .match.final .row{padding:9px 0}
  .match.final .row img{width:40px;height:40px}
  .match.final .row .n{font-size:16px;font-weight:600}
  .match.final .row .g{font-size:26px;min-width:34px}

  .champ{margin-top:12px;padding-top:12px;border-top:1px dashed var(--gold);
         text-align:center;color:var(--gold);font-weight:800;letter-spacing:1px}
  .champ small{display:block;font-weight:400;letter-spacing:2px;color:var(--muted);font-size:10px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  @media(max-width:560px){.players{display:none}}
  @media(max-width:820px){
    .bracket{grid-template-columns:1fr}
    .link{display:none}
    .col{gap:16px;margin-bottom:16px}
  }
  @media(max-width:620px){
    .matchday-card{padding:16px 12px}
    .matchday-game{grid-template-columns:1fr 1fr;gap:16px 10px}
    .matchday-team{flex-direction:column;text-align:center;gap:8px}
    .matchday-team:last-child{flex-direction:column;text-align:center}
    .matchday-team img{width:68px;height:68px}
    .matchday-team .team-name{font-size:14px}
    .matchday-team .players{display:block}
    .matchday-score{grid-column:1/-1;grid-row:2}
  }
</style>
</head>
<body>

<header>
  <img src="header.png" alt="roXtra Kickerturnier 2026 – Team. Spiel. Spass.">
</header>
<div class="subbar">
  <b>2026</b><span>&bull;</span>Gruppenphase<span>&bull;</span>Halbfinale<span>&bull;</span>Finale
</div>

<main>
  <section id="matchday-section" hidden>
    <h2>Matchday</h2>
    <div id="matchday"></div>
  </section>

  <h2>Tabellen</h2>
  <div class="grid" id="tabellen"></div>

  <h2>Turnierbaum</h2>
  <div class="bracket">
    <div>
      <div class="round-label">Halbfinale</div>
      <div class="col" id="ko-hf"></div>
    </div>
    <div class="link"></div>
    <div>
      <div class="round-label">Finale</div>
      <div id="ko-finale"></div>
    </div>
  </div>
  <div class="p3" id="ko-p3"></div>

  <h2>Spielplan</h2>
  <div class="card">
    <table class="sched">
      <thead><tr><th style="text-align:left">Termin</th><th style="text-align:left">Phase</th>
      <th style="text-align:left">Begegnung</th><th>Ergebnis</th></tr></thead>
      <tbody id="spielplan"></tbody>
    </table>
  </div>
</main>

<div class="detail-backdrop" id="team-detail" hidden>
  <section class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="detail-head">
      <img id="detail-logo" src="default.png" alt="">
      <div><h3 id="detail-title"></h3><div class="players" id="detail-players"></div></div>
      <button class="detail-close" id="detail-close" type="button" aria-label="Schliessen">&times;</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </section>
</div>

<div class="logo-preview" id="logo-preview" hidden>
  <img id="preview-logo" src="" alt="">
</div>

<footer>Ergebnisse im &lt;script&gt;-Block dieser Datei pflegen.</footer>

<script>
/* =========================================================================
   1) TEAMS  –  logo = Dateiname im selben Ordner; fehlt die Datei => default.png
   ========================================================================= */
const TEAMS = [
  { gruppe:"A", name:"Fußballhörnchen",                     p1:"Tobi",     p2:"Micha",    logo:"fussballhoernchen.png" },
  { gruppe:"A", name:"Merge Conflict",                      p1:"Tim",      p2:"Matze",    logo:"Merge-conflict.png"    },
  { gruppe:"A", name:"RosaSee",                             p1:"Kevin",    p2:"Julia",    logo:"rosasee.png"           },
  { gruppe:"A", name:"Tomvoll Attack",                      p1:"Stummi",   p2:"Michi",    logo:"tomvoll-attack.png"    },
  { gruppe:"A", name:"Hopfentornado",                       p1:"Andreas",  p2:"Viktor",   logo:"hopfentornado.png"     },
  { gruppe:"B", name:"Alpha & Omega",                       p1:"Otto",     p2:"Alex",     logo:"alpha-omega.png"       },
  { gruppe:"B", name:"Aus Versehen",                        p1:"Doro",     p2:"Inka",     logo:"aus-versehen.png"      },
  { gruppe:"B", name:"Ministerium für geheime Tätigkeiten", p1:"Phillip",  p2:"Benjamin", logo:"ministerium.png"       },
  { gruppe:"B", name:"Kickstarter",                         p1:"Philemon", p2:"Michi",    logo:"kickstarter.png"       },
  { gruppe:"B", name:"Sgladschdglei",                       p1:"Steffen",  p2:"Luca",     logo:"sgladschdglei.png"     },
];

/* =========================================================================
   2) SPIELPLAN  –  HIER ERGEBNISSE EINTRAGEN
      t1 / t2 = Tore.  gespielt:true => das Spiel zählt für die Tabelle.
   ========================================================================= */
const SPIELE = [
  { tag:"Dienstag",   datum:"06.10.2026 12:30", phase:"Gruppe A", a:"RosaSee",         b:"Hopfentornado",                       t1:4, t2:10, gespielt:true  },
  { tag:"Mittwoch",   datum:"07.10.2026 12:30", phase:"Gruppe A", a:"Fußballhörnchen", b:"Merge Conflict",                      t1:6, t2:10, gespielt:true  },
  { tag:"Donnerstag", datum:"08.10.2026 12:30", phase:"Gruppe B", a:"Alpha & Omega",   b:"Sgladschdglei",                       t1:10, t2:6,  gespielt:true },
  { tag:"Dienstag",   datum:"13.10.2026 12:30", phase:"Gruppe A", a:"Tomvoll Attack",  b:"Hopfentornado",                       t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"14.10.2026 12:30", phase:"Gruppe B", a:"Alpha & Omega",   b:"Aus Versehen",                        t1:0, t2:0,  gespielt:false },
  { tag:"Donnerstag", datum:"15.10.2026 12:30", phase:"Gruppe B", a:"Alpha & Omega",   b:"Ministerium für geheime Tätigkeiten", t1:0, t2:0,  gespielt:false },
  { tag:"Dienstag",   datum:"20.10.2026 12:30", phase:"Gruppe A", a:"RosaSee",         b:"Tomvoll Attack",                      t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"21.10.2026 12:30", phase:"Gruppe A", a:"Fußballhörnchen", b:"Hopfentornado",                       t1:0, t2:0,  gespielt:false },
  { tag:"Donnerstag", datum:"22.10.2026 12:30", phase:"Gruppe A", a:"Fußballhörnchen", b:"Tomvoll Attack",                      t1:0, t2:0,  gespielt:false },
  { tag:"Dienstag",   datum:"27.10.2026 12:30", phase:"Gruppe B", a:"Alpha & Omega",   b:"Kickstarter",                         t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"28.10.2026 12:30", phase:"Gruppe B", a:"Aus Versehen",    b:"Ministerium für geheime Tätigkeiten", t1:0, t2:0,  gespielt:false },
  { tag:"Donnerstag", datum:"29.10.2026 12:30", phase:"Gruppe B", a:"Ministerium für geheime Tätigkeiten", b:"Kickstarter",     t1:0, t2:0,  gespielt:false },
  { tag:"Dienstag",   datum:"03.11.2026 12:30", phase:"Gruppe A", a:"Fußballhörnchen", b:"RosaSee",                             t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"04.11.2026 12:30", phase:"Gruppe A", a:"Merge Conflict",  b:"RosaSee",                             t1:0, t2:0,  gespielt:false },
  { tag:"Donnerstag", datum:"05.11.2026 12:30", phase:"Gruppe B", a:"Ministerium für geheime Tätigkeiten", b:"Sgladschdglei",   t1:0, t2:0,  gespielt:false },
  { tag:"Dienstag",   datum:"10.11.2026 12:30", phase:"Gruppe B", a:"Kickstarter",     b:"Sgladschdglei",                       t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"11.11.2026 12:30", phase:"Gruppe B", a:"Aus Versehen",    b:"Kickstarter",                         t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"18.11.2026 12:30", phase:"Gruppe A", a:"Merge Conflict",  b:"Tomvoll Attack",                      t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"25.11.2026 12:30", phase:"Gruppe B", a:"Aus Versehen",    b:"Sgladschdglei",                       t1:0, t2:0,  gespielt:false },
  { tag:"Mittwoch",   datum:"02.12.2026 12:30", phase:"Gruppe A", a:"Merge Conflict",  b:"Hopfentornado",                       t1:0, t2:0,  gespielt:false },
];

/* =========================================================================
   3) K.-O.-PHASE  –  Teams ergeben sich automatisch aus den Tabellen.
      Nur Tore + gespielt pflegen.
   ========================================================================= */
const KO = {
  hf1:    { tag:"Donnerstag", datum:"03.12.2026 12:30", titel:"Halbfinale 1 · Sieger A – Zweiter B", t1:0, t2:0, gespielt:false },
  hf2:    { tag:"Dienstag",   datum:"08.12.2026 12:30", titel:"Halbfinale 2 · Sieger B – Zweiter A", t1:0, t2:0, gespielt:false },
  platz3: { tag:"Mittwoch",   datum:"09.12.2026 12:30", titel:"Spiel um Platz 3",                    t1:0, t2:0, gespielt:false },
  finale: { tag:"Donnerstag", datum:"10.12.2026 12:30", titel:"Finale",                              t1:0, t2:0, gespielt:false },
};

/* ======================= ab hier nichts mehr ändern ====================== */

const DEFAULT_LOGO = "default.png";
// Spielplan-CSV enthielt Soft Hyphens in Teamnamen - daher beim Abgleich entfernen
const norm = s => (s||"").replace(/\u00ad/g,"").trim().toLowerCase();
const byName = new Map(TEAMS.map(t => [norm(t.name), t]));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function logoSrc(name){
  const t = byName.get(norm(name));
  return t && t.logo ? t.logo : DEFAULT_LOGO;
}
function logoImg(name){
  return `<img src="${esc(logoSrc(name))}" alt="" loading="lazy"
           onerror="this.onerror=null;this.src='${DEFAULT_LOGO}'">`;
}
function teamCell(name, withPlayers){
  const t = byName.get(norm(name));
  const label = t ? t.name : name;
  const pl = (t && withPlayers) ? `<div class="players">${esc(t.p1)} &amp; ${esc(t.p2)}</div>` : "";
  return `<button class="team-link" type="button" data-team="${esc(label)}"><div class="teamcell">${logoImg(label)}<div><div class="tname">${esc(label)}</div>${pl}</div></div></button>`;
}

function tabelle(gruppe){
  const rows = new Map();
  TEAMS.filter(t => t.gruppe === gruppe).forEach(t =>
    rows.set(norm(t.name), { team:t, sp:0, s:0, n:0, tore:0, gegen:0, pkt:0 }));

  SPIELE.filter(m => m.gespielt && m.phase === "Gruppe " + gruppe).forEach(m => {
    const A = rows.get(norm(m.a)), B = rows.get(norm(m.b));
    if(!A || !B) return;
    A.sp++; B.sp++;
    A.tore += m.t1; A.gegen += m.t2;
    B.tore += m.t2; B.gegen += m.t1;
    if(m.t1 > m.t2){ A.s++; B.n++; A.pkt += 3; }
    else if(m.t1 < m.t2){ B.s++; A.n++; B.pkt += 3; }
  });

  return [...rows.values()].sort((x,y) =>
    y.pkt-x.pkt || (y.tore-y.gegen)-(x.tore-x.gegen) || y.tore-x.tore ||
    x.team.name.localeCompare(y.team.name,"de"));
}

function renderTabellen(){
  document.getElementById("tabellen").innerHTML = ["A","B"].map(g => `
    <div class="card">
      <h3>Gruppe ${g}</h3>
      <table>
        <thead><tr><th></th><th style="text-align:left">Team</th>
          <th>Sp</th><th>S</th><th>N</th><th>Tore</th><th>Diff</th><th>Pkt</th></tr></thead>
        <tbody>
        ${tabelle(g).map((r,i) => `
          <tr class="${i<2 ? "q"+(i+1) : ""}">
            <td class="pos">${i+1}</td>
            <td class="team">${teamCell(r.team.name,true)}</td>
            <td>${r.sp}</td><td>${r.s}</td><td>${r.n}</td>
            <td>${r.tore}:${r.gegen}</td>
            <td>${r.tore-r.gegen > 0 ? "+" : ""}${r.tore-r.gegen}</td>
            <td class="pts">${r.pkt}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`).join("");
}

function sieger(m,a,b){ return m.gespielt ? (m.t1 >= m.t2 ? a : b) : null; }
function verlierer(m,a,b){ return m.gespielt ? (m.t1 >= m.t2 ? b : a) : null; }

function koTeam(key, side){
  const A = tabelle("A"), B = tabelle("B");
  const n = r => r ? r.team.name : null;
  const hf1 = [n(A[0]) || "Sieger Gruppe A", n(B[1]) || "Zweiter Gruppe B"];
  const hf2 = [n(B[0]) || "Sieger Gruppe B", n(A[1]) || "Zweiter Gruppe A"];
  const map = {
    hf1, hf2,
    platz3: [verlierer(KO.hf1,hf1[0],hf1[1]) || "Verlierer HF1",
             verlierer(KO.hf2,hf2[0],hf2[1]) || "Verlierer HF2"],
    finale: [sieger(KO.hf1,hf1[0],hf1[1]) || "Sieger HF1",
             sieger(KO.hf2,hf2[0],hf2[1]) || "Sieger HF2"],
  };
  return map[key][side === "a" ? 0 : 1];
}

function alleSpiele(){
  return [...SPIELE, ...Object.keys(KO).map(k => ({
    tag:KO[k].tag, datum:KO[k].datum, phase:KO[k].titel.split(" · ")[0],
    a:koTeam(k,"a"), b:koTeam(k,"b"), t1:KO[k].t1, t2:KO[k].t2,
    gespielt:KO[k].gespielt, isKo:true
  }))];
}

function datumWert(datum){
  const teile = datum.match(/(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/);
  return teile ? new Date(+teile[3], +teile[2] - 1, +teile[1], +teile[4], +teile[5]).getTime() : 0;
}

function berechneRatings(spiele){
  const ratings = new Map(TEAMS.map(t => [norm(t.name), 1000]));

  spiele.forEach(m => {
    const keyA = norm(m.a), keyB = norm(m.b);
    const ratingA = ratings.get(keyA), ratingB = ratings.get(keyB);
    const erwartetA = 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
    const ergebnisA = m.t1 > m.t2 ? 1 : 0;
    const torabstand = Math.abs(m.t1 - m.t2);
    const faktor = 1 + Math.log(torabstand + 1);
    const delta = 20 * faktor * (ergebnisA - erwartetA);
    ratings.set(keyA, ratingA + delta);
    ratings.set(keyB, ratingB - delta);
  });
  return ratings;
}

function ratingDaten(){
  const gespielt = alleSpiele().filter(m => m.gespielt && byName.has(norm(m.a)) && byName.has(norm(m.b)))
    .sort((a,b) => datumWert(a.datum) - datumWert(b.datum));
  return ratingDatenAusSpielen(gespielt);
}

function ratingDatenAusSpielen(gespielt){
  const vorwaerts = berechneRatings(gespielt);
  const rueckwaerts = berechneRatings([...gespielt].reverse());
  const ratings = new Map(TEAMS.map(t => {
    const key = norm(t.name);
    return [key, (vorwaerts.get(key) + rueckwaerts.get(key)) / 2];
  }));
  return { ratings, gespielt };
}

function gewinnchance(nameA, nameB){
  return gewinnchanceMitRatings(nameA, nameB, ratingDaten().ratings);
}

function gewinnchanceMitRatings(nameA, nameB, ratings){
  const ratingA = ratings.get(norm(nameA)), ratingB = ratings.get(norm(nameB));
  if (ratingA === undefined || ratingB === undefined) return null;
  const erwartetA = 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
  return { a:erwartetA, b:1 - erwartetA, ratingA, ratingB };
}

function gewinnchanceVorSpiel(spiel){
  const vorherigeSpiele = alleSpiele().filter(m =>
    m.gespielt && datumWert(m.datum) < datumWert(spiel.datum) &&
    byName.has(norm(m.a)) && byName.has(norm(m.b))
  ).sort((a,b) => datumWert(a.datum) - datumWert(b.datum));
  return gewinnchanceMitRatings(spiel.a, spiel.b, ratingDatenAusSpielen(vorherigeSpiele).ratings);
}

function prozent(wert){ return Math.round(wert * 100) + "%"; }
function quote(wert){ return (1 / wert).toFixed(2).replace(".", ","); }

function prognoseMarkup(a, b){
  const p = gewinnchance(a, b);
  if (!p) return "";
  const gleichauf = p.a === p.b;
  const klasseA = gleichauf ? "draw" : p.a > p.b ? "better" : "worse";
  const klasseB = gleichauf ? "draw" : p.b > p.a ? "better" : "worse";
  return `<span class="prediction"><span class="${klasseA}">${prozent(p.a)} (${quote(p.a)})</span> · <span class="${klasseB}">${prozent(p.b)} (${quote(p.b)})</span></span>`;
}

function renderMatchday(heute = new Date()){
  const datum = `${String(heute.getDate()).padStart(2,"0")}.${String(heute.getMonth()+1).padStart(2,"0")}.${heute.getFullYear()}`;
  const spiel = alleSpiele().find(m => m.datum.startsWith(datum + " "));
  const section = document.getElementById("matchday-section");
  if (!spiel) {
    section.hidden = true;
    return;
  }
  const p = spiel.gespielt ? gewinnchanceVorSpiel(spiel) : gewinnchance(spiel.a, spiel.b);
  const prognose = p ? `<span class="prediction">${spiel.gespielt ? "Prognose vor dem Spiel" : "Prognose"}: ${prozent(p.a)} (${quote(p.a)}) · ${prozent(p.b)} (${quote(p.b)})</span>` : "";
  const team = (name) => {
    const details = byName.get(norm(name));
    const players = details ? `<div class="players">${esc(details.p1)} &amp; ${esc(details.p2)}</div>` : "";
    return `<button class="matchday-team" type="button" data-team="${esc(name)}">${logoImg(name)}<div><span class="team-name">${esc(name)}</span>${players}</div></button>`;
  };
  document.getElementById("matchday").innerHTML = `<div class="matchday-card">
    <div class="matchday-meta">${esc(spiel.tag)} · ${esc(spiel.datum)} · ${esc(spiel.phase)}</div>
    <div class="matchday-game">
      ${team(spiel.a)}
      <div class="matchday-score"><strong>${spiel.gespielt ? `${spiel.t1} : ${spiel.t2}` : "– : –"}</strong>${prognose}</div>
      ${team(spiel.b)}
    </div>
  </div>`;
  section.hidden = false;
}

function teamSpiele(name){
  return alleSpiele().filter(m => norm(m.a) === norm(name) || norm(m.b) === norm(name));
}

function renderTeamDetail(name){
  const team = byName.get(norm(name));
  if (!team) return;
  const spiele = teamSpiele(team.name);
  const vergangen = spiele.filter(m => m.gespielt);
  const stats = vergangen.reduce((sum, m) => {
    const fuer = norm(m.a) === norm(team.name) ? m.t1 : m.t2;
    const gegen = norm(m.a) === norm(team.name) ? m.t2 : m.t1;
    sum.tore += fuer; sum.gegen += gegen;
    if (fuer > gegen) sum.siege++;
    else sum.niederlagen++;
    return sum;
  }, {siege:0, niederlagen:0, tore:0, gegen:0});
  const rating = Math.round(ratingDaten().ratings.get(norm(team.name)) || 1000);
  const gameRow = m => {
    const eigenesTeam = norm(m.a) === norm(team.name);
    const gegner = eigenesTeam ? m.b : m.a;
    if (m.gespielt) {
      const fuer = eigenesTeam ? m.t1 : m.t2, gegen = eigenesTeam ? m.t2 : m.t1;
      const ergebnis = fuer > gegen ? "Sieg" : "Niederlage";
      const klasse = ergebnis === "Sieg" ? "win" : "lose";
      return `<tr><td>${esc(m.datum)}<br><span class="players">${esc(m.phase)}</span></td><td>${esc(gegner)}</td><td class="${klasse}">${ergebnis} ${fuer}:${gegen}</td></tr>`;
    }
    const p = eigenesTeam ? gewinnchance(team.name, gegner) : gewinnchance(gegner, team.name);
    const teamChance = p ? (eigenesTeam ? p.a : p.b) : null;
    return `<tr><td>${esc(m.datum)}<br><span class="players">${esc(m.phase)}</span></td><td>${esc(gegner)}</td><td>${teamChance === null ? "Offen" : `Prognose ${prozent(teamChance)} · Quote ${quote(teamChance)}`}</td></tr>`;
  };
  const detailLogo = document.getElementById("detail-logo");
  detailLogo.onerror = () => {
    detailLogo.onerror = null;
    detailLogo.src = DEFAULT_LOGO;
  };
  detailLogo.src = logoSrc(team.name);
  document.getElementById("detail-title").textContent = team.name;
  document.getElementById("detail-players").textContent = `${team.p1} & ${team.p2} · Gruppe ${team.gruppe}`;
  document.getElementById("detail-body").innerHTML = `
    <div class="detail-stats">
      <div class="detail-stat"><b>${rating}</b><span>Elo</span></div>
      <div class="detail-stat"><b>${stats.siege}</b><span>Siege</span></div>
      <div class="detail-stat"><b>${stats.niederlagen}</b><span>Niederlagen</span></div>
      <div class="detail-stat"><b>${stats.tore}:${stats.gegen}</b><span>Tore</span></div>
    </div>
    <h4>Spiele</h4>
    <table class="detail-games"><tbody>${spiele.length ? spiele.map(gameRow).join("") : "<tr><td>Noch keine Spiele vorhanden.</td></tr>"}</tbody></table>
    <div class="rating-note">Die Prognose nutzt Elo-Ratings, Gegnerstärke und Torabstand. Bei wenigen Spielen ist die Aussagekraft begrenzt.</div>`;
  document.getElementById("team-detail").hidden = false;
}

function renderKo(){
  const card = (k) => {
    const m = KO[k], a = koTeam(k,"a"), b = koTeam(k,"b");
    const w = m.gespielt ? (m.t1 > m.t2 ? a : m.t2 > m.t1 ? b : null) : null;
    const row = (name,tore,win) => `
      <div class="row ${win ? "win" : ""}"><button class="team-link" type="button" ${byName.has(norm(name)) ? `data-team="${esc(name)}"` : ""}>${logoImg(name)}
        <span class="n">${esc(name)}</span></button>
        <span class="g">${m.gespielt ? tore : "\u2013"}</span></div>`;
    return `<div class="match ${k === "finale" ? "final" : ""}">
      <h4>${esc(m.titel)}</h4>
      ${row(a,m.t1,w===a)}${row(b,m.t2,w===b)}
      <div class="mdate">${esc(m.datum)}</div>
      ${k === "finale" && w ? `<div class="champ"><small>Turniersieger</small>${esc(w)}</div>` : ""}
    </div>`;
  };
  document.getElementById("ko-hf").innerHTML     = card("hf1") + card("hf2");
  document.getElementById("ko-finale").innerHTML = card("finale");
  document.getElementById("ko-p3").innerHTML     = card("platz3");
}

function renderSpielplan(){
  const all = alleSpiele();

  document.getElementById("spielplan").innerHTML = all.map(m => {
    const cls = (x,y) => m.gespielt ? (x > y ? "win" : x < y ? "lose" : "") : "";
    const prediction = !m.gespielt && byName.has(norm(m.a)) && byName.has(norm(m.b)) ? prognoseMarkup(m.a,m.b) : "";
    return `<tr class="${m.gespielt ? "" : "open"}">
      <td><strong>${esc(m.tag)}</strong><br><span class="players">${esc(m.datum)}</span></td>
      <td><span class="tag ${m.isKo ? "ko" : ""}">${esc(m.phase)}</span></td>
      <td><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <span class="${cls(m.t1,m.t2)}">${teamCell(m.a,false)}</span>
            <span style="color:var(--muted)">vs.</span>
            <span class="${cls(m.t2,m.t1)}">${teamCell(m.b,false)}</span>
          </div></td>
      <td class="sc">${m.gespielt ? m.t1 + " : " + m.t2 : "– : –"}${prediction}</td>
    </tr>`;
  }).join("");
}

document.addEventListener("click", event => {
  const teamButton = event.target.closest("[data-team]");
  if (teamButton) renderTeamDetail(teamButton.dataset.team);
  if (event.target.id === "detail-logo") {
    document.getElementById("preview-logo").src = event.target.src;
    document.getElementById("logo-preview").hidden = false;
  }
  if (event.target.id === "logo-preview" || event.target.id === "preview-logo") {
    document.getElementById("logo-preview").hidden = true;
  }
  if (event.target.id === "detail-close" || event.target.id === "team-detail") {
    document.getElementById("team-detail").hidden = true;
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    document.getElementById("logo-preview").hidden = true;
    document.getElementById("team-detail").hidden = true;
  }
});

renderMatchday(); renderTabellen(); renderKo(); renderSpielplan();
</script>
</body>
</html>
